name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests never call Claude; they only need the packages the Claude modules import.
      - run: pip install "claude-agent-sdk==0.2.176" "pillow==13.0.0"
      - run: python -m unittest discover -s tests -v
