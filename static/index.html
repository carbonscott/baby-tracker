  }
  function log() {
    const text = box.value.trim();
    if (!text && !photo) { toast('Type or dictate what happened first'); box.focus(); return; }
    propose(proposeSheet(photo && !text ? 'From a photo' : '✨ Claude'), { text, photo });
  }
  function ask() {
    const q = box.value.trim();
    if (!q) { toast('Type a question first'); box.focus(); return; }
    openAsk(q);
  }
  box.addEventListener('input', update);
  box.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); (askBtn.classList.contains('primary') ? ask : log)(); }
  });
  drawAttach();
  update();
  openSheet('✨ Claude', 'ai tall', h('div', {}, field('', box), h('div', { class: 'actions-row' }, askBtn, logBtn), attach, chips));
  box.focus();
}

// ---------- Ask: Claude reads the log (read-only) and answers in markdown ----------
function openAsk(question) {
  const turns = [];   // this sheet's conversation; earlier turns go along as history for follow-ups
  const list = h('div');
  const follow = h('textarea', { class: 'txt', rows: 1, maxlength: 1000, enterkeyhint: 'send', placeholder: 'Ask a follow-up…', 'aria-label': 'Follow-up question' });
  const sendBtn = h('button', { class: 'btn primary', onclick: () => send(follow.value.trim()) }, 'Ask');
  follow.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); send(follow.value.trim()); }
  });
  openSheet('✨ Claude', 'ai tall', h('div', {}, list, h('div', { class: 'follow' }, follow, sendBtn)));
  let asking = false;

  function send(q) {
    if (!q || asking) return;
    follow.value = '';
    const t = { q: q.slice(0, 1000), a: null, qEl: h('div', { class: 'q' }, q), body: h('div') };
    turns.push(t);
    list.append(h('div', { class: 'turn' }, t.qEl, t.body));
    ask(t);
  }
  async function ask(t) {
    if (asking) return;
    asking = true;
    sendBtn.disabled = true;
    t.body.replaceChildren(waiting('Claude is reading the log…'));
    t.qEl.scrollIntoView({ block: 'start' });
    const history = turns.slice(0, turns.indexOf(t)).filter((x) => x.a != null).slice(-6).map((x) => ({ q: x.q, a: x.a.slice(0, 4000) }));
    try {
      const res = await api('POST', '/api/ai/ask', aiBody({ question: t.q, history }));
      if (!t.body.isConnected) return;
      t.a = String(res.answer ?? '');
      t.body.replaceChildren(renderMarkdown(t.a), h('div', { class: 'meta-row' }, h('span', {}, claudeMeta(res)),
        h('button', { type: 'button', class: 'btn small', onclick: () => copyText(mdPlain(t.a)) }, 'Copy')));
      t.qEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
    } catch (e) {
      if (!t.body.isConnected) return;
      t.body.replaceChildren(h('div', { class: 'warn-text' }, e.message),
        h('button', { type: 'button', class: 'btn', onclick: () => ask(t) }, 'Try again'));
    } finally {
      asking = false;
      sendBtn.disabled = false;
    }
  }
  send(question);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {   // older browsers / no permission: the selection fallback
    const ta = h('textarea', { class: 'visually-hidden' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) { toast("Couldn't copy"); return; }
  }
  toast('Copied');
}

// ---------- tiny markdown renderer (Claude's answers) ----------
// Builds DOM nodes with h(), so model text only ever lands in text nodes: never in innerHTML.
// Headings, paragraphs, **bold**, *italic*, `code`, bullet/numbered lists (nested), tables, quotes, rules.
const MD_FENCE = /^\s*```/;
const MD_HEADING = /^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
const MD_HR = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/;
const MD_LIST = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;
const MD_QUOTE = /^\s*>/;
const MD_TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;
const MD_INLINE = /`([^`\n]+)`|\*\*(.+?)\*\*|\*(?![\s*])(.+?)\*|\[([^\]\n]+)\]\((?:[^()\s]|\([^()\s]*\))*\)|(<br\s*\/?>)/gi;
const mdTableAt = (lines, i) => lines[i].includes('|') && i + 1 < lines.length && lines[i + 1].includes('-') && MD_TABLE_SEP.test(lines[i + 1]);
const mdBlockAt = (lines, i) => MD_FENCE.test(lines[i]) || MD_HEADING.test(lines[i]) || MD_HR.test(lines[i])
  || MD_LIST.test(lines[i]) || MD_QUOTE.test(lines[i]) || mdTableAt(lines, i);

function mdInline(s) {
  const out = [];
  let last = 0;
  for (const m of s.matchAll(MD_INLINE)) {
    if (m.index > last) out.push(s.slice(last, m.index));
    if (m[1] != null) out.push(h('code', {}, m[1]));
    else if (m[2] != null) out.push(h('strong', {}, mdInline(m[2])));
    else if (m[3] != null) out.push(h('em', {}, mdInline(m[3])));
    else if (m[4] != null) out.push(m[4]);   // links: keep the text only
    else out.push(h('br'));
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}

function renderMarkdown(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const root = h('div', { class: 'md' });
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      i++;
    } else if (MD_FENCE.test(line)) {
      const code = [];
      for (i++; i < lines.length && !MD_FENCE.test(lines[i]); i++) code.push(lines[i]);
      i++;
      root.append(h('pre', {}, h('code', {}, code.join('\n'))));
    } else if ((m = MD_HEADING.exec(line))) {
      root.append(h(['h3', 'h3', 'h4', 'h5', 'h5', 'h5'][m[1].length - 1], {}, mdInline(m[2])));
      i++;
    } else if (MD_HR.test(line)) {
      root.append(h('hr'));
      i++;
    } else if (mdTableAt(lines, i)) {
      i = mdTable(lines, i, root);
    } else if (MD_LIST.test(line)) {
      i = mdList(lines, i, root);
    } else if (MD_QUOTE.test(line)) {
      const quote = [];
      for (; i < lines.length && MD_QUOTE.test(lines[i]); i++) quote.push(lines[i].replace(/^\s*>\s?/, ''));
      root.append(h('blockquote', {}, [...renderMarkdown(quote.join('\n')).childNodes]));
    } else {   // paragraph: keeps single line breaks (chat answers use them)
      const para = [line.trim()];
      for (i++; i < lines.length && lines[i].trim() && !mdBlockAt(lines, i); i++) para.push(lines[i].trim());
      root.append(h('p', {}, para.map((l, j) => [j ? h('br') : null, mdInline(l)])));
    }
  }
  return root;
}

function mdTable(lines, i, root) {
  const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const head = cells(lines[i]);
  const align = cells(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''));
  const rows = [];
  for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(cells(lines[i]));
  const cell = (tag, text, j) => {
    const el = h(tag, {}, mdInline(text));
    if (align[j]) el.style.textAlign = align[j];
    return el;
  };
  root.append(h('div', { class: 'tbl' }, h('table', {},
    h('thead', {}, h('tr', {}, head.map((t, j) => cell('th', t, j)))),
    h('tbody', {}, rows.map((r) => h('tr', {}, head.map((_, j) => cell('td', r[j] ?? '', j))))))));
  return i;
}

function mdList(lines, i, root) {
  const stack = [];   // open lists, innermost last: {indent, el}
  let li = null;
  while (i < lines.length) {
    const m = MD_LIST.exec(lines[i]);
    if (!m) {
      if (!lines[i].trim()) {   // a blank line continues the list only if another item follows
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && MD_LIST.test(lines[j])) { i = j; continue; }
        break;
      }
      if (li && /^\s/.test(lines[i]) && !mdBlockAt(lines, i)) {   // wrapped text of the item above
        li.append(h('br'), ...mdInline(lines[i].trim()));
        i++;
        continue;
      }
      break;
    }
    const indent = m[1].replace(/\t/g, '    ').length;
    const ordered = /\d/.test(m[2]);
    while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
    let top = stack[stack.length - 1];
    const nested = top && li && indent >= top.indent + 2;
    if (!top || nested || top.el.tagName !== (ordered ? 'OL' : 'UL')) {   // a new list: first, deeper, or bullets <-> numbers
      const el = h(ordered ? 'ol' : 'ul', { start: ordered && parseInt(m[2], 10) !== 1 ? parseInt(m[2], 10) : null });
      if (!top) root.append(el);
      else if (nested) li.append(el);
      else { top.el.after(el); stack.pop(); }
      stack.push((top = { indent, el }));
    }
    li = h('li', {}, mdInline(m[3]));
    top.el.append(li);
    i++;
  }
  return i;
}

// Plain text for Copy: no markdown symbols, bullets kept, table rows as "a | b".
function mdPlain(src) {
  return String(src || '').replace(/\r\n?/g, '\n').split('\n')
    .filter((l) => !MD_TABLE_SEP.test(l))
    .map((l) => l.replace(/^\s{0,3}#{1,6}\s+/, '').replace(/^(\s*)[-*+]\s+/, '$1• ')
      .replace(/^\s*\|(.*)\|\s*$/, (_, row) => row.split('|').map((c) => c.trim()).join(' | ')))
    .join('\n')
    .replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(?![\s*])(.+?)\*/g, '$1').replace(/`([^`\n]+)`/g, '$1')
    .replace(/<br\s*\/?>/gi, ' ').trim();
}

function openSettings() {
  const name = h('input', { class: 'txt', placeholder: "Baby's name (optional)" });
  name.value = settings.name;
  const unit = seg([['ml', 'ml'], ['oz', 'oz']], settings.unit);
  openSheet('Settings', '', h('div', {},
    field('Name', name),
    field('Bottle units', unit),
    field('Export everything', h('div', { class: 'chips' },
      h('a', { class: 'chip', href: '/api/export.csv', download: '' }, 'CSV'),
      h('a', { class: 'chip', href: '/api/export.json', download: '' }, 'JSON'))),
    h('div', { class: 'hint' }, 'Tip: use "Add to Home Screen" in your browser for one-tap access. Settings are saved on this device.'),
    h('div', { class: 'actions-row' }, h('button', {
      class: 'btn primary',
      onclick: () => { settings.name = name.value.trim(); settings.unit = unit.get(); saveSettings(); closeSheet(); renderAll(); },
    }, 'Save'))));
}

$('#photoInput').addEventListener('change', (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';   // allow choosing the same photo again
  if (file) handlePhoto(file);
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetOpen()) load(); });
setInterval(tick, 1000);
setInterval(() => { if (!sheetOpen()) { renderTiles(); renderSummary(); } }, 30e3);
setInterval(() => { if (!document.hidden && !sheetOpen() && !busy) load(); }, 60e3);
load();
